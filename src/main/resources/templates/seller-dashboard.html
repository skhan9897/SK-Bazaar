<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK Bazaar - Seller Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --seller-primary: #8e44ad;
            --seller-dark: #2c3e50;
        }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar-seller { background-color: var(--seller-dark) !important; }
        .card-stat { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-seller sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" th:href="@{/}"><i class="fa-solid fa-store me-2"></i>SK Seller Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" th:href="@{/seller/inventory}">My Inventory</a></li>
                    <li class="nav-item"><a class="btn btn-sm btn-info ms-2" th:href="@{/seller/products/add}">Add New Product</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="fw-bold mb-4">Merchant Performance Dashboard</h2>

        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card card-stat bg-white p-3 border-start border-4 border-primary">
                    <h6 class="text-muted small fw-bold">GROSS SALES</h6>
                    <h3 class="fw-bold text-dark" th:text="'₹' + ${totalEarnings}">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-white p-3 border-start border-4 border-danger">
                    <h6 class="text-muted small fw-bold">PLATFORM COMMISSION (10%)</h6>
                    <h3 class="fw-bold text-danger" th:text="'₹' + ${commission}">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-white p-3 border-start border-4 border-success">
                    <h6 class="text-muted small fw-bold">NET EARNINGS</h6>
                    <h3 class="fw-bold text-success" th:text="'₹' + ${netPayable}">₹0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat bg-white p-3 border-start border-4 border-info">
                    <h6 class="text-muted small fw-bold">TOTAL PRODUCTS</h6>
                    <h3 class="fw-bold text-info" th:text="${totalProducts}">0</h3>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Quick Inventory Overview</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td th:text="${p.name}">Product</td>
                                <td th:text="${p.category?.name}">Cat</td>
                                <td th:text="'₹' + ${p.price}">Price</td>
                                <td th:text="${p.stock}">Stock</td>
                                <td>
                                    <span class="badge bg-warning text-dark" th:if="${p.status.name() == 'PENDING'}">PENDING APPROVAL</span>
                                    <span class="badge bg-success" th:if="${p.status.name() == 'APPROVED'}">LIVE</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
