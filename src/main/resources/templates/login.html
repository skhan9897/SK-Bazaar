<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Access Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --dark-color: #17252a;
            --secondary-color: #3aafa9;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            overflow: hidden;
        }
        .login-header {
            background-color: var(--dark-color);
            color: #ffffff;
            padding: 25px;
            text-align: center;
        }
        .btn-auth {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-auth:hover {
            background-color: var(--dark-color);
            color: white;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}"><i class="fa-solid fa-shop me-2"></i>SK Bazaar</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="login-header">
                        <h4 class="m-0 fw-bold"><i class="fa-solid fa-user-lock me-2"></i>Sign In Portal</h4>
                        <small class="text-muted text-light opacity-75">Access your marketplace dashboard</small>
                    </div>
                    <div class="card-body p-4">

                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2">
                            <i class="fa-solid fa-triangle-exclamation"></i> Invalid email address or secure password.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center gap-2">
                            <i class="fa-solid fa-circle-info"></i> Session closed. You have logged out successfully.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center gap-2">
                            <i class="fa-solid fa-circle-check"></i> Account created successfully! Please sign in.
                        </div>

                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold text-secondary">Registered Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-secondary">Secure Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-auth w-100 mb-3 shadow-sm"><i class="fa-solid fa-right-to-bracket me-2"></i>Authenticate Credentials</button>
                        </form>

                        <hr class="text-muted my-4">
                        <div class="text-center">
                            <p class="mb-0 text-muted small">New to SK Bazaar? <a th:href="@{/register}" class="fw-bold text-success text-decoration-none">Create a profile</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
