<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK Bazaar - List New Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-header bg-dark text-white p-4">
                        <h4 class="m-0 fw-bold">Inventory Management - List New Asset</h4>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/seller/products/add}" th:object="${product}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Commercial Product Name</label>
                                <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. Sony Bravia 4K TV">
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Brand Entity</label>
                                    <input type="text" th:field="*{brand}" class="form-control" required placeholder="e.g. Sony">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Classification Category</label>
                                    <select th:field="*{category.id}" class="form-select" required>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Selling Price (INR)</label>
                                    <input type="number" th:field="*{price}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">MRP (INR)</label>
                                    <input type="number" th:field="*{mrp}" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Current Stock Level</label>
                                    <input type="number" th:field="*{stock}" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Detailed Product Metadata (Description)</label>
                                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Submit for Admin Approval</button>
                                <a th:href="@{/seller/dashboard}" class="btn btn-outline-secondary btn-lg px-4 text-decoration-none">Abort</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
