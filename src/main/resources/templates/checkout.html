<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SK Bazaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --fk-blue: #2874f0;
            --fk-yellow: #ff9f00;
            --fk-orange: #fb641b;
            --bg-light: #f1f3f6;
        }
        body { background-color: var(--bg-light); font-family: Roboto, Arial, sans-serif; }

        .fk-mini-navbar { background-color: var(--fk-blue); height: 52px; display: flex; align-items: center; }
        .fk-nav-content { display: flex; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 10px; color: #fff; }

        .checkout-container { max-width: 1100px; margin: 20px auto; display: flex; gap: 16px; align-items: flex-start; }
        .checkout-col { flex: 1; }
        .price-col { width: 350px; }

        .step-box { background: #fff; margin-bottom: 12px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.1); }
        .step-header { padding: 15px 24px; display: flex; align-items: center; gap: 15px; }
        .step-num { background: #f0f0f0; color: var(--fk-blue); width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; border-radius: 2px; }
        .step-title { font-size: 16px; font-weight: 600; color: #878787; text-transform: uppercase; }

        .step-box.active .step-header { background: var(--fk-blue); color: #fff; }
        .step-box.active .step-num { background: #fff; }
        .step-box.active .step-title { color: #fff; }

        .step-content { padding: 24px; }

        .addr-card { border-bottom: 1px solid #f0f0f0; padding: 15px 0; display: flex; gap: 15px; }
        .btn-deliver { background: var(--fk-orange); color: #fff; border: none; padding: 10px 30px; font-weight: 600; font-size: 14px; border-radius: 2px; margin-top: 10px; }

        .price-details-header { color: #878787; padding: 13px 24px; border-bottom: 1px solid #f0f0f0; font-weight: 600; text-transform: uppercase; font-size: 16px; background: #fff; }
        .price-box { background: #fff; box-shadow: 0 1px 2px 0 rgba(0,0,0,.1); }
        .price-row { display: flex; justify-content: space-between; padding: 15px 24px; font-size: 15px; }
        .total-row { border-top: 1px dashed #e0e0e0; font-weight: 700; font-size: 18px; padding: 20px 24px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <header class="fk-mini-navbar">
        <div class="fk-nav-content">
            <h4 class="m-0 fw-bold italic">Flipkart</h4>
        </div>
    </header>

    <div class="checkout-container">
        <div class="checkout-col">
            <!-- Step 1: Login -->
            <div class="step-box">
                <div class="step-header">
                    <span class="step-num">1</span>
                    <span class="step-title">Login</span>
                    <span class="ms-auto fw-bold" style="color:var(--fk-blue)" th:text="${#authentication.name}">User</span>
                </div>
            </div>

            <!-- Step 2: Delivery Address -->
            <div class="step-box active">
                <div class="step-header">
                    <span class="step-num">2</span>
                    <span class="step-title">Delivery Address</span>
                </div>
                <div class="step-content">
                    <form th:action="@{/checkout/place}" method="POST">
                        <div th:each="addr : ${addresses}" class="addr-card">
                            <input type="radio" name="deliveryAddress" th:value="${addr.houseNumber + ', ' + addr.street + ', ' + addr.city}" required checked>
                            <div>
                                <div class="fw-bold" th:text="${addr.user.name}">Name</div>
                                <div th:text="${addr.houseNumber + ', ' + addr.street + ', ' + addr.city + ', ' + addr.state + ' - ' + addr.pincode}">Address</div>
                                <button type="button" class="btn-deliver">DELIVER HERE</button>
                            </div>
                        </div>

                        <!-- Manual Entry if needed -->
                        <div th:if="${#lists.isEmpty(addresses)}" class="mt-3">
                            <textarea name="deliveryAddress" class="form-control" placeholder="Enter manual delivery address..." required></textarea>
                        </div>

                        <div class="mt-4 pt-4 border-top">
                            <h6 class="fw-bold mb-3">PAYMENT OPTIONS</h6>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="paymentMethod" value="CASH_ON_DELIVERY" id="cod" checked>
                                <label class="form-check-label" for="cod">Cash on Delivery</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="paymentMethod" value="UPI_GOOGLE_PAY" id="upi">
                                <label class="form-check-label" for="upi">UPI (PhonePe / Google Pay)</label>
                            </div>

                            <button type="submit" class="btn btn-warning w-100 py-3 fw-bold mt-3" style="background:var(--fk-orange); border:none; color:#fff">CONFIRM ORDER</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="price-col">
            <div class="price-box">
                <div class="price-details-header">Price Details</div>
                <div class="price-row">
                    <span>Price</span>
                    <span th:text="'₹' + ${totalAmount}"></span>
                </div>
                <div class="price-row">
                    <span>Delivery Charges</span>
                    <span style="color:#388e3c">FREE</span>
                </div>
                <div class="total-row">
                    <span>Total Payable</span>
                    <span th:text="'₹' + ${totalAmount}"></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
