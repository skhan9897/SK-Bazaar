<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Secure Checkout System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --dark-color: #17252a;
            --secondary-color: #3aafa9;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: var(--dark-color) !important;
        }
        .checkout-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }
        .item-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.07);
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}"><i class="fa-solid fa-shop me-2"></i>SK Bazaar</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-dark"><i class="fa-solid fa-shield-check text-success me-2"></i>Secure Gateway Checkout</h2>

        <div class="row g-4">
            <!-- Delivery Info Form -->
            <div class="col-lg-7">
                <div class="card checkout-card p-4 mb-5">
                    <form th:action="@{/checkout/place}" method="POST">

                        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-map-pin text-danger me-2"></i>1. Finalize Delivery Destination</h4>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">CHOOSE FROM REGISTERED ADDRESSES:</label>

                            <div class="form-check p-3 border rounded-3 mb-2 bg-light d-flex align-items-center" th:each="addr : ${addresses}">
                                <input class="form-check-input ms-1" type="radio" name="deliveryAddress"
                                       th:id="'addr-' + ${addr.id}"
                                       th:value="${addr.houseNumber} + ', ' + ${addr.street} + ', ' + ${addr.city} + ' - ' + ${addr.pincode}"
                                       required>
                                <label class="form-check-label ms-3 text-dark fw-medium" th:for="'addr-' + ${addr.id}">
                                    <strong class="text-success" th:text="${addr.addressType} + ': '">Home: </strong>
                                    <span th:text="${addr.houseNumber} + ', ' + ${addr.street} + ', ' + ${addr.city} + ' - ' + ${addr.pincode}">Address text</span>
                                </label>
                            </div>

                            <div class="col-12" th:if="${#lists.isEmpty(addresses)}">
                                <div class="alert alert-warning py-2 mb-2 small"><i class="fa-solid fa-circle-exclamation me-1"></i> No saved addresses found. Please enter a manual address below.</div>
                            </div>

                            <div class="mt-3">
                                <label for="customAddress" class="form-label fw-semibold text-secondary">Or write a manual delivery address:</label>
                                <textarea class="form-control" id="customAddress" name="deliveryAddress" rows="3" placeholder="Provide complete shipping coordinates with landmark info..."></textarea>
                            </div>
                        </div>

                        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-credit-card text-primary me-2"></i>2. Choose Payment System</h4>
                        <div class="mb-4">
                            <div class="form-check p-3 border rounded-3 mb-2 bg-light d-flex align-items-center" th:each="method : ${paymentMethods}">
                                <input class="form-check-input ms-1" type="radio" name="paymentMethod"
                                       th:id="'pay-' + ${method}" th:value="${method}" required>
                                <label class="form-check-label ms-3 fw-bold text-dark" th:for="'pay-' + ${method}" th:text="${method}">
                                    COD
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold rounded-3 shadow"><i class="fa-solid fa-circle-check me-2"></i>Authorize Order Settlement</button>
                    </form>
                </div>
            </div>

            <!-- Items Review -->
            <div class="col-lg-5">
                <div class="card item-card p-3 mb-5">
                    <div class="card-body">
                        <h4 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-basket-shopping text-muted me-2"></i>Order Review Items</h4>
                        <ul class="list-group list-group-flush mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3 px-0" th:each="item : ${cartItems}">
                                <div>
                                    <h6 class="my-0 fw-bold text-dark" th:text="${item.product.name}">Product Name</h6>
                                    <small class="text-muted" th:text="'Quantity Index: ' + ${item.quantity}">Qty: 1</small>
                                </div>
                                <span class="text-success fw-bold fs-5" th:text="'₹' + (${item.product.price} * ${item.quantity})">₹0.00</span>
                            </li>
                        </ul>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center fs-3 fw-bold mt-2">
                            <span class="text-dark">Total Net Payable:</span>
                            <span class="text-success" th:text="'₹' + ${totalAmount}">₹0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
