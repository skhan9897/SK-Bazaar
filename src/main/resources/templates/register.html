<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | SK Bazaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --fk-blue: #2874f0;
            --fk-yellow: #ff9f00;
            --fk-orange: #fb641b;
        }
        body { background-color: #f1f3f6; font-family: Roboto, Arial, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .login-modal { width: 650px; height: 550px; background: #fff; display: flex; box-shadow: 0 4px 20px 0 rgba(0,0,0,.15); border-radius: 4px; overflow: hidden; }

        .login-left { width: 40%; background-color: var(--fk-blue); padding: 40px 33px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .login-left h2 { font-size: 28px; font-weight: 500; }
        .login-left p { font-size: 18px; color: #dbdbdb; line-height: 1.5; margin-top: 15px; }
        .login-left img { width: 100%; margin-top: auto; }

        .login-right { width: 60%; padding: 40px 35px 16px; display: flex; flex-direction: column; }
        .fk-input-group { margin-bottom: 25px; position: relative; }
        .fk-input { width: 100%; border: none; border-bottom: 1px solid #e0e0e0; padding: 5px 0; outline: none; font-size: 14px; }
        .fk-input:focus { border-bottom: 1px solid var(--fk-blue); }
        .fk-label { position: absolute; top: 5px; left: 0; color: #878787; font-size: 14px; pointer-events: none; transition: 0.2s ease all; }
        .fk-input:focus ~ .fk-label, .fk-input:not(:placeholder-shown) ~ .fk-label { top: -15px; font-size: 12px; color: var(--fk-blue); }

        .terms-text { color: #878787; font-size: 12px; margin-bottom: 20px; line-height: 1.4; }
        .btn-signup { background: var(--fk-orange); color: #fff; width: 100%; border: none; padding: 12px; font-weight: 500; font-size: 14px; border-radius: 2px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.2); }
        .login-link { margin-top: auto; text-align: center; color: var(--fk-blue); font-weight: 600; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-modal">
        <!-- Left Sidebar -->
        <div class="login-left">
            <div>
                <h2>Looks like you're new here!</h2>
                <p>Sign up with your details to get started</p>
            </div>
            <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/login_img_c4a81e.png" alt="">
        </div>

        <!-- Right Form -->
        <div class="login-right">
            <form th:action="@{/register}" th:object="${registerRequest}" method="POST">

                <div class="fk-input-group">
                    <input type="text" th:field="*{name}" class="fk-input" placeholder=" " required>
                    <label class="fk-label">Enter Full Name</label>
                </div>

                <div class="fk-input-group">
                    <input type="email" th:field="*{email}" class="fk-input" placeholder=" " required>
                    <label class="fk-label">Enter Email Address</label>
                </div>

                <div class="fk-input-group">
                    <input type="text" th:field="*{mobile}" class="fk-input" placeholder=" " required>
                    <label class="fk-label">Enter Mobile Number</label>
                </div>

                <div class="fk-input-group">
                    <input type="password" th:field="*{password}" class="fk-input" placeholder=" " required>
                    <label class="fk-label">Set Password</label>
                </div>

                <div class="fk-input-group">
                    <label class="form-label small text-muted">Join as:</label>
                    <select th:field="*{role}" class="form-select border-0 border-bottom rounded-0 px-0" style="font-size: 14px;">
                        <option value="CUSTOMER">Customer (Shop)</option>
                        <option value="SELLER">Merchant (Sell)</option>
                    </select>
                </div>

                <div class="terms-text">
                    By continuing, you agree to SK Bazaar's Terms and Conditions.
                </div>

                <button type="submit" class="btn-signup">CONTINUE</button>
            </form>

            <a th:href="@{/login}" class="login-link">Existing User? Log in</a>
        </div>
    </div>

</body>
</html>
