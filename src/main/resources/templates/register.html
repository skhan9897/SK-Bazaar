<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Member Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --dark-color: #17252a;
            --secondary-color: #3aafa9;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .register-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            overflow: hidden;
        }
        .register-header {
            background-color: var(--dark-color);
            color: #ffffff;
            padding: 25px;
            text-align: center;
        }
        .btn-reg {
            background-color: #2ecc71;
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-reg:hover {
            background-color: #27ae60;
            color: white;
        }
        .form-control, .form-select {
            padding: 11px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex flex-column">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}"><i class="fa-solid fa-shop me-2"></i>SK Bazaar</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card register-card">
                    <div class="register-header">
                        <h4 class="m-0 fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Create Platform Profile</h4>
                        <small class="text-light opacity-75">Join SK Bazaar marketplace today</small>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/register}" th:object="${registerRequest}" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold text-secondary">Full Legal Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" th:field="*{name}" class="form-control" id="name" required placeholder="John Doe">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold text-secondary">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control" id="email" required placeholder="john@example.com">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="mobile" class="form-label fw-semibold text-secondary">Mobile Connection Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="text" th:field="*{mobile}" class="form-control" id="mobile" required placeholder="9876543210">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold text-secondary">Account Security Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control" id="password" required placeholder="Create strong security string">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="role" class="form-label fw-semibold text-secondary">Select Account Privilege Type</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-users-gear text-muted"></i></span>
                                    <select th:field="*{role}" class="form-select" id="role">
                                        <option value="CUSTOMER">Standard Customer Profile</option>
                                        <option value="SELLER">Marketplace Merchant / Seller</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-reg w-100 mb-3 shadow-sm"><i class="fa-solid fa-check-double me-2"></i>Execute Registration</button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="mb-0 text-muted small">Already registered with us? <a th:href="@{/login}" class="fw-bold text-success text-decoration-none">Sign In instead</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
