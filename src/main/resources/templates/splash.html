<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SK Bazaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #17252a 0%, #2b7a78 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .splash-container {
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .logo-icon {
            font-size: 5rem;
            color: #3aafa9;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        .app-name {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tagline {
            font-size: 1.2rem;
            color: #def2f1;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        .loader-dots span {
            width: 15px;
            height: 15px;
            margin: 0 5px;
            background-color: #3aafa9;
            border-radius: 50%;
            display: inline-block;
            animation: dots 1.4s infinite ease-in-out both;
        }
        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes dots {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <i class="fa-solid fa-bolt logo-icon"></i>
        <h1 class="app-name text-success">SK BAZAAR</h1>
        <p class="tagline">India's Ultimate Modern Monolith Mega Marketplace</p>

        <div class="loader-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        // Redirect to homepage after 2.5 seconds splash screen simulation
        setTimeout(() => {
            window.location.href = "/home-dashboard";
        }, 2500);
    </script>
</body>
</html>
