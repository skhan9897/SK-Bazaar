<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Personal Saved Wishlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --dark-color: #17252a;
            --secondary-color: #3aafa9;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: var(--dark-color) !important;
        }
        .wish-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-color: #ffffff;
            transition: all 0.3s ease;
        }
        .wish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .placeholder-image {
            height: 140px;
            background: linear-gradient(45deg, #eee, #f9f9f9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary-color);
            border-radius: 8px 8px 0 0;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}"><i class="fa-solid fa-shop me-2"></i>SK Bazaar</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white fw-semibold" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-dark"><i class="fa-solid fa-heart text-danger me-2"></i>Your Curated Wishlist</h2>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${!#lists.isEmpty(wishlistItems)}">
            <div class="col" th:each="item : ${wishlistItems}">
                <div class="card h-100 wish-card">
                    <div class="placeholder-image">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="card-title fw-bold text-dark mb-1 text-truncate" th:text="${item.product.name}">Product Name</h5>
                        <p class="card-text text-muted small mb-2" th:text="${item.product.brand ?: 'Premium Brand'}">Brand</p>
                        <h5 class="text-success fw-bold mb-3" th:text="'₹' + ${item.product.price}">₹0.00</h5>

                        <div class="d-grid gap-2 mt-auto">
                            <a th:href="@{'/products/' + ${item.product.id}}" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-circle-info me-1"></i>View Details</a>
                            <form th:action="@{/cart/add}" method="POST" class="m-0">
                                <input type="hidden" name="productId" th:value="${item.product.id}" />
                                <input type="hidden" name="quantity" value="1" />
                                <button type="submit" class="btn btn-sm btn-success w-100"><i class="fa-solid fa-cart-plus me-1"></i>Move to Cart</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="alert alert-light text-center py-5 border rounded-3 shadow-sm" th:if="${#lists.isEmpty(wishlistItems)}">
            <i class="fa-solid fa-heart-circle-xmark display-1 text-muted mb-3"></i>
            <h3 class="fw-bold text-secondary">Your wishlist catalog is empty!</h3>
            <p class="text-muted">Save customized product tokens while exploring the marketplace index.</p>
            <a th:href="@{/}" class="btn btn-primary px-4 rounded-pill mt-2" style="background-color: var(--primary-color); border:none;"><i class="fa-solid fa-store me-2"></i>Explore Products Inventory</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
