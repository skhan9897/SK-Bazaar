<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Manage Shipping Addresses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --dark-color: #17252a;
            --secondary-color: #3aafa9;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background-color: var(--dark-color) !important;
        }
        .address-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-color: #ffffff;
            transition: transform 0.2s;
        }
        .address-card:hover {
            transform: translateY(-3px);
        }
        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            background-color: #ffffff;
        }
        .form-control {
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" th:href="@{/}"><i class="fa-solid fa-shop me-2"></i>SK Bazaar</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white fw-semibold" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row g-4">
            <!-- Address List -->
            <div class="col-lg-7">
                <h3 class="mb-4 fw-bold text-dark"><i class="fa-solid fa-map-location-dot text-success me-2"></i>Your Saved Addresses</h3>
                <div class="row row-cols-1 g-3">
                    <div class="col" th:each="addr : ${addresses}">
                        <div class="card address-card border-start border-4 border-success">
                            <div class="card-body p-4">
                                <span class="badge bg-dark mb-2 px-3 py-2 rounded-pill" th:text="${addr.addressType}">Home</span>
                                <h5 class="card-title fw-bold text-dark mb-2" th:text="${addr.houseNumber} + ', ' + ${addr.street}">House No, Street</h5>
                                <p class="card-text text-muted mb-1" th:text="'📍 Landmark: ' + ${addr.landmark ?: 'N/A'}"></p>
                                <p class="card-text text-dark fw-medium mb-0" th:text="'🏙️ ' + ${addr.city} + ', ' + ${addr.state} + ' - ' + ${addr.pincode}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-12" th:if="${#lists.isEmpty(addresses)}">
                        <div class="alert alert-light text-center py-5 border rounded-3 shadow-sm">
                            <i class="fa-solid fa-house-chimney-user display-1 text-muted mb-3"></i>
                            <h5 class="text-secondary fw-bold">No saved addresses found in your marketplace profile!</h5>
                            <p class="text-muted mb-0">Please use the creation portal on the right to append shipping destination records.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Address Form -->
            <div class="col-lg-5">
                <div class="card form-card p-4 mb-5">
                    <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-square-plus text-primary me-2"></i>Add New Address Record</h4>
                    <form th:action="@{/address/add}" th:object="${newAddress}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Address Tag Type (e.g. Home, Office)</label>
                            <input type="text" th:field="*{addressType}" class="form-control" placeholder="e.g. Home" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">House / Apartment / Plot Number</label>
                            <input type="text" th:field="*{houseNumber}" class="form-control" placeholder="e.g. Flat 302, Royal Enclave" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Street / Sector / Colony Name</label>
                            <input type="text" th:field="*{street}" class="form-control" placeholder="e.g. Park Street" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Nearby Landmark Reference</label>
                            <input type="text" th:field="*{landmark}" class="form-control" placeholder="e.g. Opposite Central Park">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary">City</label>
                                <input type="text" th:field="*{city}" class="form-control" required placeholder="City">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary">State / Province</label>
                                <input type="text" th:field="*{state}" class="form-control" required placeholder="State">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary">Postal Pincode</label>
                            <input type="text" th:field="*{pincode}" class="form-control" placeholder="e.g. 110001" required>
                        </div>
                        <button type="submit" class="btn btn-primary bg-gradient w-100 py-3 fw-bold rounded-3 shadow-sm" style="background-color: var(--primary-color); border:none;"><i class="fa-solid fa-floppy-disk me-2"></i>Persist Address Details</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
