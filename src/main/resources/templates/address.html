<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Bazaar - Manage Addresses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f6; font-family: Roboto, Arial, sans-serif; }
        .navbar { background-color: #2874f0 !important; }
        .profile-container { padding-top: 20px; }
        .sidebar { background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
        .sidebar-header { padding: 12px 12px 12px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .sidebar-header img { width: 50px; height: 50px; border-radius: 50%; margin-right: 15px; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .menu-section { border-bottom: 1px solid #f0f0f0; padding: 15px 0; }
        .menu-title { padding-left: 55px; color: #878787; font-size: 14px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
        .menu-title i { margin-left: -35px; width: 25px; color: #2874f0; }
        .menu-item { padding: 10px 0 10px 55px; color: #212121; font-size: 14px; cursor: pointer; text-decoration: none; display: block; }
        .menu-item:hover, .menu-item.active { background: #f5faff; color: #2874f0; font-weight: 500; }
        .content-area { background: #fff; padding: 25px; box-shadow: 0 2px 4px rgba(0,0,0,.08); min-height: 500px; }
        .address-card { border: 1px solid #f0f0f0; padding: 20px; margin-bottom: 20px; position: relative; }
        .addr-type { background: #f0f0f0; padding: 2px 8px; font-size: 11px; font-weight: 600; border-radius: 2px; margin-bottom: 10px; display: inline-block; }
        .btn-add-new { color: #2874f0; font-weight: 600; border: 1px solid #e0e0e0; padding: 15px; width: 100%; text-align: left; background: #fff; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">SK Bazaar</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" th:href="@{/}">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container profile-container">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="sidebar mb-4">
                    <div class="sidebar-header">
                        <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/profile-pic-male_4811a3.svg" alt="User">
                        <div>
                            <div class="small text-muted">Hello,</div>
                            <div class="fw-bold" th:text="${user != null ? user.name : 'Customer'}">User Name</div>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-menu">
                        <div class="menu-section">
                            <a th:href="@{/orders}" class="menu-item">
                                <i class="fa-solid fa-folder-open me-2 text-primary"></i> MY ORDERS <i class="fa-solid fa-chevron-right float-end mt-1 small text-muted"></i>
                            </a>
                        </div>
                        <div class="menu-section">
                            <div class="menu-title"><i class="fa-solid fa-user"></i> ACCOUNT SETTINGS</div>
                            <a th:href="@{/profile}" class="menu-item">Profile Information</a>
                            <a th:href="@{/address}" class="menu-item active">Manage Addresses</a>
                        </div>
                        <div class="menu-section">
                            <div class="menu-title"><i class="fa-solid fa-wallet"></i> PAYMENTS</div>
                            <a href="#" class="menu-item">Saved Cards</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content area -->
            <div class="col-md-9">
                <div class="content-area">
                    <h5 class="fw-bold mb-4">Manage Addresses</h5>

                    <button class="btn-add-new shadow-sm mb-4" data-bs-toggle="collapse" data-bs-target="#addAddressForm">
                        <i class="fa-solid fa-plus me-3"></i> ADD A NEW ADDRESS
                    </button>

                    <div class="collapse mb-4" id="addAddressForm">
                        <div class="card card-body border-primary">
                            <form th:action="@{/address/add}" th:object="${newAddress}" method="POST">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <input type="text" th:field="*{houseNumber}" class="form-control" placeholder="House No." required>
                                    </div>
                                    <div class="col-md-6">
                                        <input type="text" th:field="*{street}" class="form-control" placeholder="Street Name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Select State</label>
                                        <select th:field="*{state}" id="stateSelect" class="form-select" required onchange="updateDistricts()">
                                            <option value="">-- Choose State --</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Select District</label>
                                        <select th:field="*{city}" id="districtSelect" class="form-select" required>
                                            <option value="">-- Choose District --</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <input type="text" th:field="*{pincode}" class="form-control" placeholder="Pincode" required>
                                    </div>
                                    <div class="col-md-6">
                                        <input type="text" th:field="*{addressType}" class="form-control" placeholder="Address Type (Home/Work)" required>
                                    </div>
                                    <div class="col-12 mt-4">
                                        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">SAVE</button>
                                        <button type="button" class="btn btn-link text-decoration-none" data-bs-toggle="collapse" data-bs-target="#addAddressForm">CANCEL</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div th:each="addr : ${addresses}" class="address-card shadow-sm">
                        <span class="addr-type" th:text="${addr.addressType}">HOME</span>
                        <div class="d-flex justify-content-between">
                            <div>
                                <p class="mb-1"><strong>SK Bazaar User</strong> <span class="ms-3 fw-bold" th:text="${user != null ? user.mobile : ''}"></span></p>
                                <p class="mb-0 text-muted" th:text="${addr.houseNumber} + ', ' + ${addr.street} + ', ' + ${addr.city} + ', ' + ${addr.state} + ' - ' + ${addr.pincode}"></p>
                            </div>
                            <div class="dropdown">
                                <button class="btn btn-link text-dark p-0" data-bs-toggle="dropdown"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#">Edit</a></li>
                                    <li><a class="dropdown-item text-danger" href="#">Delete</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(addresses)}" class="text-center py-5">
                        <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/myaddresses-empty_672ef4.png" width="200" alt="Empty">
                        <p class="text-muted mt-3">No addresses found in your account.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
