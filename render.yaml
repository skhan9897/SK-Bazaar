services:
  # Backend Spring Boot Service
  - type: web
    name: sk-bazaar-backend
    env: docker
    plan: free
    region: ohio
    dockerFilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sk-bazaar-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sk-bazaar-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sk-bazaar-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sk-bazaar-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sk-bazaar-db
          property: password
      - key: SPRING_AI_GOOGLE_GENAI_API_KEY
        value: "your-api-key-here" # Replace with actual key in Render dashboard
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # Frontend React Service
  - type: web
    name: sk-bazaar-frontend
    env: static
    plan: free
    publishPath: frontend/build
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: REACT_APP_API_URL
        value: https://sk-bazaar-backend.onrender.com/api

# Database Service (PostgreSQL recommended for Render production)
databases:
  - name: sk-bazaar-db
    plan: free
